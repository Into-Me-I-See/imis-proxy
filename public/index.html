<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Into-Me-I-See</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="https://abqfbjpxlxxxqjzdpmij.supabase.co/storage/v1/object/public/app-assets/20250928_181524_0000.png">
<style>
  :root{--amber1:#ffb01f;--amber2:#ff8a00;--bg:#000;--card:#0b0b0b;--text:#fff}
  html,body{height:100%}
  body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
  .wrap{max-width:560px;width:100%;padding:24px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .logo img{width:72px;height:72px;border-radius:18px;object-fit:contain}
  h1{margin:16px 0 8px;font-size:28px;letter-spacing:.3px;text-align:center}
  p{margin:0 0 18px;opacity:.85;line-height:1.5;text-align:center}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{appearance:none;border:0;border-radius:9999px;padding:14px 22px;font-weight:700;cursor:pointer;transition:transform .06s ease,opacity .2s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(90deg,var(--amber1),var(--amber2));color:#000;box-shadow:0 8px 24px rgba(255,138,0,.35)}
  .btn-ghost{background:#0b0b0b;border:1px solid #333;color:#ffd166}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">
        <img src="https://abqfbjpxlxxxqjzdpmij.supabase.co/storage/v1/object/public/app-assets/20250928_181524_0000.png" alt="Into-Me-I-See Logo">
      </div>
      <h1>Into-Me-I-See</h1>
      <p>Install the app for a full-screen experience and enable notifications to receive gentle practice reminders.</p>
      <div class="actions">
        <button id="pwa-install" class="btn btn-primary">Install the App</button>
        <button id="enable-push" class="btn btn-ghost">Enable notifications</button>
      </div>
    </div>
  </div>

  <script>
    let deferredPrompt=null;
    const installBtn=document.getElementById('pwa-install');
    const pushBtn=document.getElementById('enable-push');

    function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
    function isAndroid(){return /android/i.test(navigator.userAgent)}
    function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone}

    window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;installBtn.textContent='Install the App'});

    if(isStandalone()){
      installBtn.style.display='none';
    }else{
      installBtn.style.display='inline-flex';
      installBtn.textContent=isIOS()?'Add to Home Screen':'Install the App';
    }

    function showIOSBottomPopup(){
      if(document.getElementById('imis-ios-popup')) return;
      const popup=document.createElement('div');
      popup.id='imis-ios-popup';
      popup.style.position='fixed';
      popup.style.left='50%';
      popup.style.bottom='20px';
      popup.style.transform='translateX(-50%)';
      popup.style.background='rgba(0,0,0,0.9)';
      popup.style.border='1px solid rgba(255,176,31,0.5)';
      popup.style.borderRadius='16px';
      popup.style.padding='18px 22px';
      popup.style.width='90%';
      popup.style.maxWidth='360px';
      popup.style.color='#fff';
      popup.style.fontSize='15px';
      popup.style.fontWeight='500';
      popup.style.textAlign='center';
      popup.style.boxShadow='0 8px 24px rgba(0,0,0,.6)';
      popup.style.zIndex='99';
      popup.style.opacity='0';
      popup.style.transition='opacity .3s ease';
      popup.innerHTML=
        '<div style="margin-bottom:8px;font-weight:700;color:#ffb01f;">Add Into-Me-I-See to your Home Screen</div>'+
        '<div style="line-height:1.5;margin-bottom:10px;">In Safari, tap <b>Share</b> ⬆️ → <b>Add to Home Screen</b>, then open the app from your Home Screen.</div>'+
        '<button id="imis-ios-close" style="background:linear-gradient(90deg,#ffb01f,#ff8a00);border:0;border-radius:9999px;padding:9px 16px;font-weight:700;color:#000;cursor:pointer;">Got it 💛</button>';
      document.body.appendChild(popup);
      requestAnimationFrame(()=>{popup.style.opacity='1';});
      document.getElementById('imis-ios-close').onclick=()=>{popup.style.opacity='0';setTimeout(()=>popup.remove(),200);}
    }

    installBtn.addEventListener('click',async()=>{
      if(deferredPrompt){
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt=null;
      }else if(isIOS()&&!isStandalone()){
        showIOSBottomPopup();
      }else{
        alert('Install not available on this browser.');
      }
    });

    const VAPID_PUBLIC_KEY='BG9Ke25lIFppz2UUG_OsqbM7YelVtH2DPpkWRYbkVv2rDMN-3MCVgTUSoOF3dRQ4dJobOEbt_sA36MDbmtLzs4g';

    function base64UrlToUint8Array(input){
      const s=input.trim().replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
      const padded=s+'='.repeat((4-(s.length%4))%4);
      const raw=atob(padded);
      const out=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
      return out;
    }

    async function enablePush(){
      if(isIOS()&&!isStandalone()){showIOSBottomPopup();return}
      if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window)){alert('Notifications not supported on this device/browser.');return}
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){alert('Notifications were blocked.');return}
      const reg=await navigator.serviceWorker.ready;
      const appServerKey=base64UrlToUint8Array(VAPID_PUBLIC_KEY);
      if(appServerKey.length!==65){alert('VAPID key format issue.');return}
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:appServerKey});
      await fetch('/api/saveSubscription',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});
      alert('Notifications enabled ✅');
    }

    pushBtn.addEventListener('click',enablePush);

    if('serviceWorker'in navigator){
      window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{})});
    }

    const canPush=('Notification'in window)&&('serviceWorker'in navigator)&&('PushManager'in window);
    if(!canPush && !isIOS()){
      pushBtn.style.display='none';
    }
    if(isIOS()&&!isStandalone()){
      pushBtn.textContent='Enable notifications (after Add to Home Screen)';
    }
  </script>

  <script>
    function isInAppBrowser(){
      const ua=navigator.userAgent.toLowerCase();
      return ua.includes('fbav')||ua.includes('fban')||ua.includes('instagram')||ua.includes('line/')||ua.includes('twitter');
    }
    function suggestOpenExternally(){
      const div=document.createElement('div');
      div.style.position='fixed';
      div.style.left='50%';
      div.style.bottom='20px';
      div.style.transform='translateX(-50%)';
      div.style.background='rgba(0,0,0,.85)';
      div.style.border='1px solid #333';
      div.style.borderRadius='14px';
      div.style.padding='12px 16px';
      div.style.color='#fff';
      div.style.fontWeight='600';
      div.style.zIndex='60';
      div.style.backdropFilter='blur(6px)';
      div.innerHTML='Open this page in Safari/Chrome to install and enable notifications. <button id="copylink" style="margin-left:10px;border:1px solid #444;border-radius:999px;background:#0b0b0b;color:#ffd166;font-weight:700;padding:8px 12px;cursor:pointer">Copy Link</button>';
      document.body.appendChild(div);
      const btn=document.getElementById('copylink');
      if(btn){btn.onclick=async()=>{await navigator.clipboard.writeText(location.href);div.innerHTML='Link copied. Open Safari/Chrome and paste to continue.';};}
    }
    if(isInAppBrowser()) suggestOpenExternally();

    if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !(matchMedia('(display-mode: standalone)').matches||navigator.standalone)){
      const p=document.getElementById('enable-push');
      if(p){p.disabled=true;p.textContent='Enable notifications (after Add to Home Screen)';}
    }
  </script>
</body>
</html>
