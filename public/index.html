<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Into-Me-I-See</title>

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon-192x192.png" />

  <style>
    html,body{height:100%;margin:0;background:#000}
    iframe{width:100%;height:100%;border:0;display:block}
  </style>
</head>
<body>
  <iframe src="/api/proxy?path=/"></iframe>

  <script>
    (async () => {
      try {
        if (!('serviceWorker' in navigator)) return;
        await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;

        const perm = await Notification.requestPermission();
        if (perm !== 'granted') return;

        const r = await fetch('/api/public-key');
        if (!r.ok) return;
        const { vapidPublicKey } = await r.json();

        const toUint8 = (b64) => {
          const p = '='.repeat((4 - (b64.length % 4)) % 4);
          const s = (b64 + p).replace(/-/g, '+').replace(/_/g, '/');
          const raw = atob(s);
          const out = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
          return out;
        };

        const sub = await (await navigator.serviceWorker.ready).pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: toUint8(vapidPublicKey),
        });

        await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub),
        });
      } catch {}
    })();
  </script>
</body>
</html>
