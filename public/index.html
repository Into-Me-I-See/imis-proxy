<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=2">
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2">
  <title>Into-Me-I-See</title>
  <style>
    html,body{height:100%;margin:0;background:#000}
    iframe{width:100%;height:100%;border:0;display:block}
  </style>
</head>
<body>
  <iframe src="/api/proxy?path=/"></iframe>

  <script>
    (async () => {
      try {
        if (!('serviceWorker' in navigator)) return;
        await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        await navigator.serviceWorker.ready;

        const perm = await Notification.requestPermission();
        if (perm !== 'granted') return;

        const r = await fetch('/api/public-key');
        if (!r.ok) return;
        const { vapidPublicKey } = await r.json();

        const toUint8 = (b64) => {
          const p = '='.repeat((4 - (b64.length % 4)) % 4);
          const s = (b64 + p).replace(/-/g, '+').replace(/_/g, '/');
          const raw = atob(s);
          const out = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
          return out;
        };

        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: toUint8(vapidPublicKey),
        });

        await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub),
        });
      } catch {}
    })();

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.createElement('button');
      btn.textContent = 'Install Into-Me-I-See';
      btn.style.cssText = 'position:fixed;inset:auto 16px 16px auto;z-index:9999';
      btn.onclick = async () => {
        btn.remove();
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      };
      document.body.appendChild(btn);
    });
  </script>
</body>
</html>
