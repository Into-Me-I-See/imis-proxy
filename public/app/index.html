<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Into-Me-I-See</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="https://abqfbjpxlxxxqjzdpmij.supabase.co/storage/v1/object/public/app-assets/20250928_181524_0000.png">
<style>
  html,body{height:100%;margin:0;background:#000}
  .wrap{height:100dvh;height:100vh;background:#000}
  .appframe{border:0;width:100%;height:100%;display:block;background:#000}
  .fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .overlay{position:fixed;right:14px;bottom:14px;display:none;gap:10px;z-index:10}
  .btn{appearance:none;border:0;border-radius:9999px;padding:12px 18px;font-weight:700;cursor:pointer}
  .btn-amber{background:linear-gradient(90deg,#ffb01f,#ff8a00);color:#000;box-shadow:0 8px 24px rgba(255,138,0,.35)}
</style>
</head>
<body>
<div class="wrap">
  <iframe class="appframe" src="https://app.into-me-i-see.ca" allow="fullscreen; notifications"></iframe>

  <div id="fallback" class="fallback">
    <div>
      <div style="text-align:center;margin-bottom:12px">Opening the app…</div>
      <a href="https://app.into-me-i-see.ca" style="display:inline-block;background:#ffb01f;color:#000;padding:12px 18px;border-radius:9999px;font-weight:700;text-decoration:none">Open in browser</a>
    </div>
  </div>

  <div id="notifOverlay" class="overlay">
    <button id="enablePush" class="btn btn-amber">Enable notifications</button>
  </div>
</div>

<script>
  const VAPID_PUBLIC_KEY = "BG9Ke25lIFppz2UUG_OsqbM7YelVtH2DPpkWRYbkVv2rDMN-3MCVgTUSoOF3dRQ4dJobOEbt_sA36MDbmtLzs4g";

  function base64UrlToUint8Array(input){
    const s=input.trim().replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
    const padded=s+'='.repeat((4-(s.length%4))%4);
    const raw=atob(padded);
    const out=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
    return out;
  }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
  function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone; }

  const frame=document.querySelector('.appframe');
  const fb=document.getElementById('fallback');
  let loaded=false;
  const t=setTimeout(()=>{ if(!loaded){ fb.style.display='flex'; } }, 3000);
  frame.addEventListener('load', ()=>{ loaded=true; clearTimeout(t); fb.style.display='none'; });

  async function hasPush(){
    try{
      if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription();
      return !!sub;
    }catch{ return false; }
  }

  async function enablePush(){
    try{
      if(isIOS() && !isStandalone()){
        alert('Add to Home Screen first, then reopen to enable notifications.');
        return;
      }
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){ alert('Notifications blocked. Enable in site settings.'); return; }
      const reg=await navigator.serviceWorker.ready;
      const appServerKey=base64UrlToUint8Array(VAPID_PUBLIC_KEY);
      const sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: appServerKey });

      // ask Base44 (iframe) who the user is
      const user = await new Promise((resolve, reject)=>{
        const to=setTimeout(()=>reject(new Error('No user reply')), 5000);
        function onMsg(e){
          if(!e.data || e.data.type!=='imis_user') return;
          window.removeEventListener('message', onMsg);
          clearTimeout(to);
          resolve({ userId:e.data.userId, token:e.data.token });
        }
        window.addEventListener('message', onMsg);
        frame.contentWindow.postMessage({type:'imis_whoami'}, '*');
      });

      // send subscription to Base44 backend
      const r = await fetch('https://app.into-me-i-see.ca/api/push/subscribe', {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+user.token
        },
        body: JSON.stringify({ userId: user.userId, subscription: sub })
      });
      if(!r.ok){ alert('Saving subscription failed'); return; }

      document.getElementById('notifOverlay').style.display='none';
      try{ frame.contentWindow.postMessage({type:'imis_push_enabled'}, '*'); }catch{}
      alert('Notifications enabled ✅');
    }catch{
      alert('Failed to enable notifications');
    }
  }

  async function showOverlayIfNeeded(){
    const already = await hasPush();
    if(!already) document.getElementById('notifOverlay').style.display='flex';
  }

  document.getElementById('enablePush').addEventListener('click', enablePush);

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(showOverlayIfNeeded); });
  }
</script>
</body>
</html>
