<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Into-Me-I-See • PWA Shell</title>
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.ico">
  <style>
    html,body{height:100%;margin:0;background:#000}
    .wrap{height:100dvh;height:100vh;background:#000}
    .appframe{border:0;width:100%;height:100%;display:block;background:#000}
  </style>
</head>
<body>
  <div class="wrap">
    <iframe
      id="appframe"
      class="appframe"
      src="https://app.into-me-i-see.ca"
      allow="fullscreen; clipboard-read; clipboard-write; autoplay"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>

  <script>
    const APP_ORIGIN = "https://app.into-me-i-see.ca";
    const VAPID_PUBLIC_KEY = "BOB7zT289Y8avf3ofm5Wf5xJRoFDlS-wfl47mJIMUjMVN_1ywWgfW7BIfRn565BYcHcCagpI0ovFV__FzHqVdGw";

    async function registerPush() {
      try {
        if (Notification.permission === 'default') await Notification.requestPermission();
        const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        const swReady = await navigator.serviceWorker.ready;

        const toU8 = s =>
          Uint8Array.from(
            atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(s.length + (4 - (s.length % 4)) % 4, '=')),
            c => c.charCodeAt(0)
          );

        const old = await swReady.pushManager.getSubscription();
        if (old) await old.unsubscribe();

        const sub = await swReady.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: toU8(VAPID_PUBLIC_KEY)
        });

        const saveRes = await fetch(`${APP_ORIGIN}/api/functions/registerDeviceToken`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: '68705a603e42b5c97c444d2',
            subscription: sub
          })
        });

        const data = await saveRes.json();
        console.log('Device Token Registered:', data);
      } catch (err) {
        console.error('Push Registration Failed:', err);
      }
    }

    registerPush();
  </script>
</body>
</html>
