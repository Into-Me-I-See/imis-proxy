<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Into-Me-I-See</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="https://abqfbjpxlxxxqjzdpmij.supabase.co/storage/v1/object/public/app-assets/20250928_181524_0000.png">
<style>
html,body{height:100%;margin:0;background:#000}
.wrap{height:100dvh;height:100vh;background:#000}
.appframe{border:0;width:100%;height:100%;display:block;background:#000}
.fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.overlay{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:none;z-index:10}
.btn{appearance:none;border:0;border-radius:9999px;padding:12px 18px;font-weight:700;cursor:pointer}
.btn-amber{background:linear-gradient(90deg,#ffb01f,#ff8a00);color:#000;box-shadow:0 8px 24px rgba(255,138,0,.35)}
</style>
</head>
<body>
<div class="wrap">
  <iframe
    id="appframe"
    class="appframe"
    src="https://app.into-me-i-see.ca"
    allow="fullscreen; clipboard-read; clipboard-write; autoplay"
    referrerpolicy="no-referrer"
  ></iframe>

  <div id="fallback" class="fallback">
    <div>
      <div style="text-align:center;margin-bottom:12px">Opening the app…</div>
      <a href="https://app.into-me-i-see.ca" style="display:inline-block;background:#ffb01f;color:#000;padding:12px 18px;border-radius:9999px;font-weight:700;text-decoration:none">Open in browser</a>
    </div>
  </div>
</div>

<script>
const APP_ORIGIN = "https://app.into-me-i-see.ca";
const VAPID_PUBLIC_KEY = "BG9Ke25lIFppz2UUG_OsqbM7YelVtH2DPpkWRYbkVv2rDMN-3MCVgTUSoOF3dRQ4dJobOEbt_sA36MDbmtLzs4g";

function b64ToU8(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(s.padEnd(s.length + (4 - (s.length % 4)) % 4, '=')), c => c.charCodeAt(0));
}

async function swReady(){
  if(!('serviceWorker' in navigator)) return null;
  return await navigator.serviceWorker.ready;
}

async function getSub(){
  try {
    const r = await swReady();
    return r ? await r.pushManager.getSubscription() : null;
  } catch {
    return null;
  }
}

async function saveSub(userId, sub){
  await fetch("https://app.into-me-i-see.ca/api/functions/registerDeviceToken", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId, subscription: sub })
  });
}

async function enablePush(userId){
  if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
    parent.postMessage({ source: "imis_pwa", type: "imis_push_status", enabled: false, reason: "unsupported" }, APP_ORIGIN);
    return;
  }

  const perm = (Notification.permission === 'default') ? await Notification.requestPermission() : Notification.permission;
  if(perm !== "granted"){
    parent.postMessage({ source: "imis_pwa", type: "imis_push_status", enabled: false, reason: "denied" }, APP_ORIGIN);
    return;
  }

  await navigator.serviceWorker.register("/sw.js", { scope: "/" });
  const reg = await swReady();
  const key = b64ToU8(VAPID_PUBLIC_KEY);
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });

  await saveSub(userId, sub);
  parent.postMessage({ source: "imis_pwa", type: "imis_push_status", enabled: true }, APP_ORIGIN);
}

window.addEventListener("message", async (e) => {
  if(e.origin !== APP_ORIGIN) return;
  const msg = e.data || {};
  if(msg.type === "imis_enable_push"){
    const userId = msg.userId || msg.payload?.userId;
    if(userId) enablePush(userId);
  }
  if(msg.type === "imis_push_status_request"){
    const sub = await getSub();
    parent.postMessage({ source: "imis_pwa", type: "imis_push_status", enabled: !!sub }, APP_ORIGIN);
  }
});

(async () => {
  const sub = await getSub();
  parent.postMessage({ source: "imis_pwa", type: "imis_push_status", enabled: !!sub }, APP_ORIGIN);
})();
</script>
</body>
</html>
