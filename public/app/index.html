<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Into-Me-I-See</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="https://abqfbjpxlxxxqjzdpmij.supabase.co/storage/v1/object/public/app-assets/20250928_181524_0000.png">
<style>
html,body{height:100%;margin:0;background:#000}
.wrap{height:100dvh;height:100vh;background:#000}
.appframe{border:0;width:100%;height:100%;display:block;background:#000}
.fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.overlay{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:none;z-index:10}
.btn{appearance:none;border:0;border-radius:9999px;padding:12px 18px;font-weight:700;cursor:pointer}
.btn-amber{background:linear-gradient(90deg,#ffb01f,#ff8a00);color:#000;box-shadow:0 8px 24px rgba(255,138,0,.35)}
</style>
</head>
<body>
<div class="wrap">
  <iframe
  id="appframe"
  class="appframe"
  src="https://app.into-me-i-see.ca"
  allow="fullscreen; clipboard-read; clipboard-write; autoplay"
  referrerpolicy="no-referrer"
></iframe>

  <div id="fallback" class="fallback">
    <div>
      <div style="text-align:center;margin-bottom:12px">Opening the app…</div>
      <a href="https://app.into-me-i-see.ca" style="display:inline-block;background:#ffb01f;color:#000;padding:12px 18px;border-radius:9999px;font-weight:700;text-decoration:none">Open in browser</a>
    </div>
  </div>

  <div id="notifOverlay" class="overlay">
    <button id="enablePush" class="btn btn-amber">Enable notifications</button>
  </div>
</div>

<script>
const VAPID_PUBLIC_KEY="BG9Ke25lIFppz2UUG_OsqbM7YelVtH2DPpkWRYbkVv2rDMN-3MCVgTUSoOF3dRQ4dJobOEbt_sA36MDbmtLzs4g";

function base64UrlToUint8Array(s){
  s=s.trim().replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
  const p=s+'='.repeat((4-(s.length%4))%4);
  const r=atob(p);const o=new Uint8Array(r.length);
  for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);
  return o;
}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone}

const overlay=document.getElementById('notifOverlay');
const enableBtn=document.getElementById('enablePush');
const frame=document.getElementById('appframe');
const fb=document.getElementById('fallback');

let loaded=false;
const t=setTimeout(()=>{if(!loaded){fb.style.display='flex';}},3000);
frame.addEventListener('load',()=>{loaded=true;clearTimeout(t);fb.style.display='none';});

async function getSW(){if(!('serviceWorker'in navigator))return null;const r=await navigator.serviceWorker.ready;return r}
async function getSub(){try{const r=await getSW();if(!r||!('PushManager'in window))return null;return await r.pushManager.getSubscription()}catch{return null}}

async function showOverlayIfNeeded(){
  if(isIOS()&&!isStandalone()){overlay.style.display='none';return}
  if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window)){overlay.style.display='none';return}
  if(Notification.permission==='denied'){overlay.style.display='none';return}
  const sub=await getSub();
  overlay.style.display=sub?'none':'block';
}

async function handshake(){
  return await new Promise((resolve,reject)=>{
    const to=setTimeout(()=>reject(new Error('no_user')),6000);
    function onMsg(e){if(!e.data||e.data.type!=='imis_user')return;window.removeEventListener('message',onMsg);clearTimeout(to);resolve({userId:e.data.userId,token:e.data.token})}
    window.addEventListener('message',onMsg);
    frame.contentWindow.postMessage({type:'imis_whoami'},'*');
  });
}

async function saveSubscription(sub,user){
  try{
    const res=await fetch('https://app.into-me-i-see.ca/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+user.token},body:JSON.stringify({userId:user.userId,subscription:sub})});
    return res.ok;
  }catch{return false}
}

async function enablePush(){
  try{
    if(isIOS()&&!isStandalone()){alert('Add to Home Screen first, then reopen to enable notifications.');return}
    const perm=(Notification.permission==='default')?await Notification.requestPermission():Notification.permission;
    if(perm!=='granted'){alert('Notifications blocked. Enable in site settings.');return}
    const reg=await getSW(); if(!reg){alert('No service worker.');return}
    const key=base64UrlToUint8Array(VAPID_PUBLIC_KEY);
    if(key.length!==65){alert('VAPID key invalid.');return}
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    let user=null; try{user=await handshake()}catch{user=null}
    if(user){const ok=await saveSubscription(sub,user); if(!ok){alert('Saved locally but backend save failed.');}}
    overlay.style.display='none';
    try{frame.contentWindow.postMessage({type:'imis_push_enabled'},'*')}catch{}
    alert('Notifications enabled ✅');
  }catch(e){
    alert('Failed to enable notifications');
  }
}

enableBtn.addEventListener('click',enablePush);

if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(showOverlayIfNeeded);
  });
}

const APP_ORIGIN = "https://app.into-me-i-see.ca";
const PWA_ORIGIN = "https://pwa.into-me-i-see.ca";

function sendToApp(type,payload){
  if(frame && frame.contentWindow){
    frame.contentWindow.postMessage({source:"imis_pwa",type,payload},APP_ORIGIN);
  }
}

window.addEventListener("message",(e)=>{
  if(e.origin!==APP_ORIGIN)return;
  const msg=e.data||{};
  if(msg.source!=="imis_app")return;

  if(msg.type==="imis_ready"){
    sendToApp("imis_whoami",null);
  }

  if(msg.type==="imis_session"){
    try{localStorage.setItem("imis_session",JSON.stringify(msg.payload||{}));}catch{}
    console.log("Session from app:",msg.payload);
  }

  if(msg.type==="imis_pong"){
    console.log("PONG",Date.now()-(msg.payload||0),"ms");
  }
});

frame.addEventListener("load",()=>{
  sendToApp("imis_ping",Date.now());
});
</script>
</body>
</html>
