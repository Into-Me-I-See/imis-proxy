<script>
let deferredPrompt=null;
const openBtn=document.getElementById('open-app');
const installBtn=document.getElementById('install-app');
const iosModal=document.getElementById('ios-a2hs');
const iosClose=document.getElementById('ios-a2hs-close');

function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone;}

function render(){
  const standalone=isStandalone();
  if(standalone){
    openBtn.style.display='inline-flex';
    installBtn.style.display='none';
  }else{
    openBtn.style.display='none';
    if(isIOS()){
      installBtn.style.display='inline-flex';
    }else{
      installBtn.style.display=deferredPrompt?'inline-flex':'none';
    }
  }
}

window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;render();});
window.matchMedia('(display-mode: standalone)').addEventListener('change',render);

installBtn.addEventListener('click',async()=>{
  if(isIOS()){iosModal.style.display='block';return;}
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  render();
});

iosClose.addEventListener('click',()=>iosModal.style.display='none');
openBtn.addEventListener('click',()=>{window.location.href='/app';});

// safety: remove any stale flag that older builds may have set
try{localStorage.removeItem('imis_installed');}catch{}
render();
</script>
